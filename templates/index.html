<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPX Track Analyzer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2rem;
      width: 100%;
      max-width: 860px;
      margin-bottom: 1.5rem;
    }

    /* Upload area */
    .drop-zone {
      border: 2px dashed #334155;
      border-radius: 0.75rem;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.05);
    }

    .drop-zone svg {
      width: 3rem;
      height: 3rem;
      color: #38bdf8;
      margin-bottom: 1rem;
    }

    .drop-zone p {
      color: #94a3b8;
      margin-bottom: 1rem;
    }

    .drop-zone strong {
      color: #e2e8f0;
    }

    #file-input { display: none; }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
      font-weight: 600;
      padding: 0.6rem 1.5rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #file-name {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #38bdf8;
      min-height: 1.2em;
    }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
    }

    .stat-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.25rem 1rem;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 0.4rem;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .stat-unit {
      font-size: 0.8rem;
      color: #64748b;
      margin-left: 0.15rem;
    }

    /* Chart */
    .chart-container {
      position: relative;
      height: 280px;
    }

    /* Error / loading */
    #status {
      min-height: 1.5rem;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 0.5rem;
    }

    .error { color: #f87171; }
    .loading { color: #94a3b8; }

    #results { display: none; }
  </style>
</head>
<body>

  <h1>GPX Track Analyzer</h1>
  <p class="subtitle">Upload a GPX file to analyze your walk or hike</p>

  <!-- Upload card -->
  <div class="card">
    <div class="drop-zone" id="drop-zone">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 9.414V19a2 2 0 01-2 2z" />
      </svg>
      <p><strong>Drag & drop your GPX file here</strong></p>
      <p>or</p>
      <label for="file-input">
        <span class="btn">Browse file</span>
      </label>
      <input type="file" id="file-input" accept=".gpx" />
      <div id="file-name"></div>
    </div>
    <div id="status"></div>
  </div>

  <!-- Results card -->
  <div class="card" id="results">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="chart-container" style="margin-top:1.75rem;">
      <canvas id="elevation-chart"></canvas>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileNameEl = document.getElementById('file-name');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const statsGrid = document.getElementById('stats-grid');

    let chartInstance = null;

    // Drag & drop
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      if (!file.name.toLowerCase().endsWith('.gpx')) {
        showError('Please select a .gpx file.');
        return;
      }
      fileNameEl.textContent = file.name;
      uploadAndAnalyze(file);
    }

    function showError(msg) {
      statusEl.className = 'error';
      statusEl.textContent = msg;
      resultsEl.style.display = 'none';
    }

    function showLoading(msg) {
      statusEl.className = 'loading';
      statusEl.textContent = msg;
    }

    async function uploadAndAnalyze(file) {
      showLoading('Analyzing track…');
      resultsEl.style.display = 'none';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('/analyze', { method: 'POST', body: formData });
        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Analysis failed.');
          return;
        }

        statusEl.textContent = '';
        displayResults(data);
      } catch (err) {
        showError('Network error. Please try again.');
      }
    }

    function displayResults(data) {
      // Build stat boxes
      const stats = [
        { label: 'Distance', value: data.distance_km, unit: 'km' },
        { label: 'Elevation Gain', value: data.elevation_gain_m, unit: 'm' },
        { label: 'Elevation Loss', value: data.elevation_loss_m, unit: 'm' },
        { label: 'Avg Speed', value: data.avg_speed_kmh !== null ? data.avg_speed_kmh : '—', unit: data.avg_speed_kmh !== null ? 'km/h' : '' },
        { label: 'Track Points', value: data.point_count.toLocaleString(), unit: '' },
      ];

      statsGrid.innerHTML = stats.map(s => `
        <div class="stat-box">
          <div class="stat-label">${s.label}</div>
          <div class="stat-value">${s.value}<span class="stat-unit">${s.unit}</span></div>
        </div>
      `).join('');

      // Draw chart
      const labels = data.profile.map(p => p.d);
      const elevations = data.profile.map(p => p.e);

      if (chartInstance) chartInstance.destroy();

      const ctx = document.getElementById('elevation-chart').getContext('2d');

      const gradient = ctx.createLinearGradient(0, 0, 0, 280);
      gradient.addColorStop(0, 'rgba(56,189,248,0.35)');
      gradient.addColorStop(1, 'rgba(56,189,248,0.0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Elevation (m)',
            data: elevations,
            borderColor: '#38bdf8',
            borderWidth: 2,
            backgroundColor: gradient,
            fill: true,
            tension: 0.3,
            pointRadius: 0,
            pointHoverRadius: 4,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: items => `Distance: ${items[0].label} km`,
                label: item => `Elevation: ${item.raw} m`,
              },
              backgroundColor: '#1e293b',
              borderColor: '#334155',
              borderWidth: 1,
              titleColor: '#94a3b8',
              bodyColor: '#38bdf8',
            }
          },
          scales: {
            x: {
              title: { display: true, text: 'Distance (km)', color: '#64748b', font: { size: 11 } },
              ticks: {
                color: '#64748b',
                maxTicksLimit: 10,
                callback: v => labels[v] !== undefined ? labels[v] : v,
              },
              grid: { color: '#1e293b' },
            },
            y: {
              title: { display: true, text: 'Elevation (m)', color: '#64748b', font: { size: 11 } },
              ticks: { color: '#64748b' },
              grid: { color: '#334155' },
            }
          }
        }
      });

      resultsEl.style.display = 'block';
    }
  </script>
</body>
</html>
